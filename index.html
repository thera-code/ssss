<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="الملتقى السوري السويسري - جمعية ثقافية واجتماعية" />
  <title>الملتقى السوري السويسري</title>

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <!-- الشريط العلوي الثابت -->
  <header class="navbar" id="navbar">
    <button class="menu-toggle icon-btn" id="menuToggle" aria-label="فتح القائمة">
      <i data-lucide="menu"></i>
    </button>

    <a href="index.html" class="brand">
      <img src="assets/images/logo.png" alt="Logo" class="brand-logo" id="brandLogo" />
      <span class="brand-name" data-i18n="site.name">الملتقى السوري السويسري</span>
    </a>

    <div class="nav-actions">
      <button class="icon-btn theme-toggle" id="themeToggle" aria-label="تبديل الوضع">
        <i data-lucide="moon" class="icon-moon"></i>
        <i data-lucide="sun" class="icon-sun"></i>
      </button>

      <div class="lang-switcher" id="langSwitcher">
        <button class="icon-btn lang-btn" id="langBtn" aria-label="تغيير اللغة">
          <i data-lucide="globe"></i>
          <span class="lang-current" id="langCurrent">AR</span>
        </button>
        <div class="lang-menu" id="langMenu">
          <!-- تُبنى ديناميكياً -->
        </div>
      </div>
    </div>
  </header>

  <!-- القائمة الجانبية -->
  <aside class="sidebar" id="sidebar">
    <nav class="sidebar-nav" id="sidebarNav">
      <!-- تُبنى ديناميكياً من config.json -->
    </nav>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- المحتوى الرئيسي -->
  <main class="main">
    <!-- Hero -->
    <section class="hero" id="hero">
      <div class="hero-bg" id="heroBg"></div>
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h1 class="hero-title" data-i18n="home.heroTitle">مرحباً بكم</h1>
        <p class="hero-subtitle" data-i18n="home.heroSubtitle">جمعية ثقافية واجتماعية</p>
        <a href="events.html" class="btn-primary" data-i18n="home.cta">استكشف فعالياتنا</a>
      </div>
    </section>

    <!-- قسم التعريف -->
    <section class="about-section container">
      <h2 class="section-title" data-i18n="home.aboutTitle">عن الجمعية</h2>
      <p class="section-text" data-i18n="home.aboutText"></p>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-col">
          <h3 class="footer-brand-name" data-i18n="site.name"></h3>
          <p class="footer-desc" data-i18n="footer.description"></p>
        </div>

        <div class="footer-col">
          <h4 class="footer-heading" data-i18n="footer.followUs">تابعونا</h4>
          <div class="footer-social" id="footerSocial"></div>
        </div>

        <div class="footer-col">
          <h4 class="footer-heading" data-i18n="footer.quickLinks">روابط سريعة</h4>
          <ul class="footer-links" id="footerLinks"></ul>
        </div>
      </div>

      <div class="footer-bottom">
        <span id="copyrightText"></span>
        <span class="powered-by" id="poweredBy"></span>
      </div>
    </footer>
  </main>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
