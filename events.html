<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الفعاليات - الملتقى السوري السويسري</title>

  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="navbar" id="navbar">
    <button class="menu-toggle icon-btn" id="menuToggle" aria-label="فتح القائمة">
      <i data-lucide="menu"></i>
    </button>
    <a href="index.html" class="brand">
      <img src="assets/images/logo.png" alt="Logo" class="brand-logo" id="brandLogo" />
      <span class="brand-name" data-i18n="site.name">الملتقى السوري السويسري</span>
    </a>
    <div class="nav-actions">
      <button class="icon-btn theme-toggle" id="themeToggle" aria-label="تبديل الوضع">
        <i data-lucide="moon" class="icon-moon"></i>
        <i data-lucide="sun" class="icon-sun"></i>
      </button>
      <div class="lang-switcher" id="langSwitcher">
        <button class="icon-btn lang-btn" id="langBtn" aria-label="تغيير اللغة">
          <i data-lucide="globe"></i>
          <span class="lang-current" id="langCurrent">AR</span>
        </button>
        <div class="lang-menu" id="langMenu"></div>
      </div>
    </div>
  </header>

  <aside class="sidebar" id="sidebar">
    <nav class="sidebar-nav" id="sidebarNav"></nav>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <main class="main">
    <section class="page-header container">
      <h1 class="page-title" data-i18n="events.title">الفعاليات</h1>
      <p class="page-subtitle" data-i18n="events.subtitle">اكتشف أنشطتنا القادمة</p>
    </section>

    <section class="events-section container">
      <div class="events-grid" id="eventsGrid"></div>
      <p class="empty-msg" id="eventsEmpty" style="display:none" data-i18n="events.empty">لا توجد فعاليات حالياً</p>
    </section>

    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-col">
          <h3 class="footer-brand-name" data-i18n="site.name"></h3>
          <p class="footer-desc" data-i18n="footer.description"></p>
        </div>
        <div class="footer-col">
          <h4 class="footer-heading" data-i18n="footer.followUs">تابعونا</h4>
          <div class="footer-social" id="footerSocial"></div>
        </div>
        <div class="footer-col">
          <h4 class="footer-heading" data-i18n="footer.quickLinks">روابط سريعة</h4>
          <ul class="footer-links" id="footerLinks"></ul>
        </div>
      </div>
      <div class="footer-bottom">
        <span id="copyrightText"></span>
        <span class="powered-by" id="poweredBy"></span>
      </div>
    </footer>
  </main>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
